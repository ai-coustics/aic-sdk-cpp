name: Build, Run Examples and Test

on:
  push:
    branches: [main]
    tags:
      - "*"
  pull_request:
    branches: [main]

jobs:
  build-and-run:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, windows-11-arm]
    env:
      AIC_SDK_LICENSE: ${{ secrets.AIC_SDK_LICENSE }}
      # Model version required by this SDK release (aic_get_compatible_model_version).
      AIC_MODEL_VERSION: v6
      # Enhancement model driving the Processor example.
      AIC_ENHANCEMENT_MODEL_ID: quail-vf-2.2-s-16khz
      # Dedicated VAD model driving the standalone Vad example.
      AIC_VAD_MODEL_ID: vad-2.1-xxs-16khz
      # Dedicated analysis model driving the Collector / Analyzer example.
      AIC_ANALYSIS_MODEL_ID: tyto-l-16khz

    steps:
      - uses: actions/checkout@v4

      # Model filenames carry a content hash, so they are resolved through the public
      # manifest by model ID instead of being hardcoded here.
      - name: Download models
        shell: python
        run: |
          import json, os, pathlib, urllib.request

          BASE = "https://artifacts.ai-coustics.io/"
          version = os.environ["AIC_MODEL_VERSION"]
          out_dir = pathlib.Path("models").resolve()
          out_dir.mkdir(parents=True, exist_ok=True)

          with urllib.request.urlopen(BASE + "manifest.json") as response:
              manifest = json.load(response)

          paths = {}
          for env_var in (
              "AIC_ENHANCEMENT_MODEL_ID",
              "AIC_VAD_MODEL_ID",
              "AIC_ANALYSIS_MODEL_ID",
          ):
              model_id = os.environ[env_var]
              model = manifest["models"].get(model_id)
              if model is None:
                  raise SystemExit(f"model {model_id} is not in the manifest")
              entry = model["versions"].get(version)
              if entry is None:
                  available = ", ".join(sorted(model["versions"]))
                  raise SystemExit(
                      f"model {model_id} has no {version} release (available: {available})"
                  )

              target = out_dir / entry["filename"]
              print(f"{model_id} {version} -> {target}")
              urllib.request.urlretrieve(BASE + entry["file"], target)
              paths[env_var] = target

          # Absolute paths, so they stay valid from any build directory.
          with open(os.environ["GITHUB_ENV"], "a") as env_file:
              env_file.write(f"AIC_ENHANCEMENT_MODEL={paths['AIC_ENHANCEMENT_MODEL_ID']}\n")
              env_file.write(f"AIC_VAD_MODEL={paths['AIC_VAD_MODEL_ID']}\n")
              env_file.write(f"AIC_ANALYSIS_MODEL={paths['AIC_ANALYSIS_MODEL_ID']}\n")

      - name: Configure Examples
        run: cmake -B build ./example

      - name: Build Examples
        run: cmake --build build -j

      - name: Run Enhancement Example (Linux/macOS)
        if: runner.os != 'Windows'
        run: ./build/aic-sdk-enhancement "$AIC_ENHANCEMENT_MODEL"

      - name: Run VAD Example (Linux/macOS)
        if: runner.os != 'Windows'
        run: ./build/aic-sdk-vad "$AIC_VAD_MODEL"

      - name: Run Analyzer Example (Linux/macOS)
        if: runner.os != 'Windows'
        run: ./build/aic-sdk-analyzer "$AIC_ANALYSIS_MODEL"

      - name: Run Enhancement Example (Windows)
        if: runner.os == 'Windows'
        run: .\build\Debug\aic-sdk-enhancement.exe $env:AIC_ENHANCEMENT_MODEL

      - name: Run VAD Example (Windows)
        if: runner.os == 'Windows'
        run: .\build\Debug\aic-sdk-vad.exe $env:AIC_VAD_MODEL

      - name: Run Analyzer Example (Windows)
        if: runner.os == 'Windows'
        run: .\build\Debug\aic-sdk-analyzer.exe $env:AIC_ANALYSIS_MODEL

      # The test project resolves and downloads its own model at configure time.
      - name: Configure Tests
        run: cmake -B build-test ./test

      - name: Build Tests
        run: cmake --build build-test -j

      # -C Debug is required by multi-config generators and ignored by single-config ones.
      - name: Run Tests
        run: ctest --test-dir build-test -C Debug --output-on-failure

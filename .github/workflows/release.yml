name: Create GitHub Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # CHANGELOG.md sections are "## x.y.z - YYYY-MM-DD"; extract the body of the section
      # matching the pushed tag and use it verbatim as the release body.
      - name: Extract changelog section
        run: |
          TAG="${{ github.ref_name }}"
          awk -v ver="$TAG" '
            $0 ~ "^## " ver " - " { flag=1; next }
            flag && /^## / { flag=0 }
            flag { print }
          ' CHANGELOG.md > notes.md

          if [ ! -s notes.md ]; then
            echo "No CHANGELOG.md section found for tag $TAG" >&2
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes-file notes.md
